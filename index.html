<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    
    <!-- VIEWPORT CON SOPORTE DE PANTALLA COMPLETA & IPHONE (NOTCH E ISLA DINÁMICA) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <!-- TÍTULO DE MARCA & SEO -->
    <title>SANTOS | Date un gusto!</title>
    <meta name="description" content="Santos Smash Burgers. Date un buen gusto! Smash burgers con carne 100% vacuno, pan de papa y papas triple cocción. Delivery y take away." />
    <meta name="keywords" content="smash burgers, hamburguesas, cheeseburger, papas fritas, delivery de comida, take away, buenos aires." />

    <!-- INTEGRACIÓN MÓVIL APPLE / ANDROID -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Santos" />
    <meta name="format-detection" content="telephone=no" />

    <!-- THEME COLOR: Combina con la barra superior crema de la web -->
    <!-- THEME COLOR: Blanco puro para que se funda con la hamburguesa en iPhone -->
    <meta name="theme-color" content="#ffffff" />

    <!-- FAVICON SANTOS (SVG nativo + icono para pantalla de inicio de iPhone) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23083821'/%3E%3Ctext x='50%25' y='58%25' font-family='sans-serif' font-weight='900' font-size='38' fill='%23eb623a' text-anchor='middle' dominant-baseline='middle'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="/santos.png" />

    <!-- TIPOGRAFÍAS: Barlow Condensed (display) + Plus Jakarta Sans (cuerpo) + Pacifico (script) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">

    <!-- EVITAR FLASH INICIAL: Sincronizar fondo antes de que cargue React -->
    <style>
      :root { --bg-initial: #f2eee2; }
      body { background-color: var(--bg-initial) !important; }
      #root { background-color: var(--bg-initial); min-height: 100vh; }
    </style>
  </head>

  <body class="bg-[#f2eee2] text-[#083821] antialiased overflow-x-hidden min-h-screen">
    <!-- Contenedor Maestro de React -->
    <div id="root"></div>

    <!-- Script de Arranque -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
